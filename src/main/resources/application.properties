# MTOGO backend configuration.
# This file is committed. It contains NO secrets, only placeholders.
# Real values come from environment variables or a local .env file (never committed).
# See .env.example for the variables you need.

spring.application.name=mtogo-backend

# Load a local .env file if it exists (optional, so CI and containers work without it)
spring.config.import=optional:file:.env[.properties]

# === Database (PostgreSQL) ===
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mtogo}
spring.datasource.username=${DB_USER:mtogo}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# === Actuator ===
# Only the health endpoint is exposed. Docker uses it to decide whether a new version started.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# === Application ===
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
