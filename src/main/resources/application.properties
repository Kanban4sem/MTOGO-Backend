# MTOGO backend configuration.
# This file is committed. It contains NO secrets, only placeholders.
# Real values come from environment variables or a local .env file (never committed).
# See .env.example for the variables you need.

spring.application.name=mtogo-backend

# Load a local .env file if it exists (optional, so CI and containers work without it)
spring.config.import=optional:file:.env[.properties]

# === Database (PostgreSQL) ===
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mtogo}
spring.datasource.username=${DB_USER:mtogo}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# === Actuator (ADR-007) ===
# The actuator runs on its own port, reachable only on the Docker network. The API port 8080 serves no actuator endpoint.
management.server.port=8081
# Docker checks health here to decide whether a new version started. Prometheus scrapes the metrics.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Fixed buckets for API requests, so Prometheus can calculate p95 and the share of requests under 500 ms.
management.metrics.distribution.slo.http.server.requests=25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s

# === Application ===
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
# An enum field in a request accepts only its names, so {"status": 1} answers 400 instead of meaning the second value.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# Seeded users (ADR-006). A role's users are created on startup only when its password is set.
# Prod leaves these empty, so prod has no seeded users.
app.seed.customer-password=${SEED_CUSTOMER_PASSWORD:}
app.seed.restaurant-password=${SEED_RESTAURANT_PASSWORD:}
app.seed.delivery-agent-password=${SEED_DELIVERY_AGENT_PASSWORD:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}

# Authentication uses Bearer tokens, never cookies. The signing key is Base64-encoded and at least 32 random bytes.
app.jwt.secret=${JWT_SECRET:}
app.jwt.lifetime-seconds=${JWT_LIFETIME_SECONDS:900}
spring.jpa.open-in-view=false
