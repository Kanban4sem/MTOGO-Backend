# Test-only settings, loaded on top of src/main/resources/application.properties.
# Cached test contexts close when the JVM exits. Tomcat must not wait for
# requests then, or Surefire kills the test JVM.
server.shutdown=immediate

# Tests seed users only where they ask for it, never from a developer's .env.
app.seed.customer-password=
app.seed.restaurant-password=
app.seed.delivery-agent-password=
