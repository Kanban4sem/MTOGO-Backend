name: Ready
# Triggered by 'ready/*' branches pushed by 'gh tt deliver'

on:
  workflow_dispatch:
  push:
    branches:
      - "ready/**"

concurrency:
  group: ready
  cancel-in-progress: false

jobs:
  build:
    name: Ready flow, runs when a new commit is pushed to a ready branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The 4-core runner keeps the parallel test JVMs from #74 (#84)
      MTOGO_TEST_FORKS: 4
    permissions:
      contents: read
      statuses: write # required to set commit statuses for gh insitu

    steps:
      # Sonar needs the history to find new code against main and to blame lines
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up and verify runner environment
        uses: ./.github/actions/prep-runner
        with:
          verify: gh insitu run trunk-worthy

      # Reuses the classes and the JaCoCo report trunk-worthy wrote. A failed gate, or no result, fails the job,
      # so merge-to-trunk doesn't run. SonarQube Cloud has no reference branch setting at project level, so the
      # delivery's new code is measured against main here (#21)
      - name: SonarQube Cloud quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "ERROR: secrets.SONAR_TOKEN is not configured. See Code quality in the README."
            exit 1
          fi
          ./mvnw -B sonar:sonar -Dsonar.qualitygate.wait=true -Dsonar.newCode.referenceBranch=main

  merge-to-trunk:
    name: Merge to trunk
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      pull-requests: write
      issues: write
      contents: write

    steps:
      - name: Verify READY_PUSHER secret
        shell: bash
        env:
          READY_PUSHER: ${{ secrets.READY_PUSHER }}
        run: |
          if [ -z "${READY_PUSHER}" ]; then
            echo "ERROR: secrets.READY_PUSHER is not configured."
            echo "Create a PAT with content:write enabled and store it as a repository (or organization) secret named READY_PUSHER."
            exit 1
          fi
          echo "READY_PUSHER is configured."

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.READY_PUSHER }} # PAT with content:write (GITHUB_TOKEN pushes do not trigger other workflows)

      # Pinned to a commit, because the action receives READY_PUSHER. Update the SHA by hand to update TakT (#21)
      - uses: devx-cafe/takt-actions/ready-to-trunk@d354e40ce1916a4fce4bd30f095e9aecc952adeb # v1
