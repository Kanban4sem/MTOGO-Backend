# .insitu.yml - TakT quality checks for MTOGO Backend
# The same checks run locally (pre-commit hook) and in GitHub Actions.

defaults:
  die-on-error: true
  timeout: 10m
  verbose: false

inventory:
  - id: gh-auth
    name: GitHub Authentication
    command: gh auth status

  - id: install-gh-insitu
    name: Install gh-insitu
    command: gh extension install devx-cafe/gh-insitu

  - id: install-gh-tt
    name: Install gh-tt
    command: gh extension install devx-cafe/gh-tt

  - id: install-takt-shortcuts
    name: Install TakT shortcuts
    command: |
      gh alias set workon '!gh tt workon "$@"' --clobber
      gh alias set wrapup '!gh tt wrapup "$@"' --clobber
      gh alias set deliver '!gh tt deliver "$@"' --clobber
      gh alias set semver '!gh tt semver "$@"' --clobber

  - id: safe-repo
    name: Mark repository as safe for git operations
    command: git config --global --add safe.directory "$(pwd)"

  - id: repo-gitconfig
    name: Use repo-root .gitconfig for consistent git settings
    command: |
      git config --local --get include.path | grep -e ../.gitconfig >/dev/null 2>&1 || \
      git config --local --add include.path ../.gitconfig

  # Git for Windows clones with core.symlinks=false, which checks the
  # .claude/skills symlink out as a plain file, so Claude Code finds no skills.
  # The config write is retried once, since repo-gitconfig writes .git/config
  # in the same parallel wave.
  - id: claude-skills-symlink
    name: Check .claude/skills out as a symlink
    command: |
      git config --local core.symlinks true || { sleep 1; git config --local core.symlinks true; }
      if [ ! -L .claude/skills ]; then
        rm -f .claude/skills
        git checkout -- .claude/skills
      fi

  - id: install-npm-tools
    name: Install linting and checker tools
    command: |
      npm install -g prettier markdownlint-cli2 cspell @cspell/dict-da-dk

  # Separate from install-npm-tools, which the GitHub runner also runs.
  - id: install-codex
    name: Install the Codex CLI
    command: npm install -g @openai/codex

  # Docker creates new named volumes owned by root. These hold each
  # developer's Claude Code and Codex login (see mounts in devcontainer.json).
  - id: agent-config-owner
    name: Give the agent config volumes to the container user
    command: sudo chown -R "$(id -u):$(id -g)" "$HOME/.claude" "$HOME/.codex"

  - id: cspell
    name: Run cspell
    command: cspell --no-progress --no-summary --words-only --unique

  - id: markdownlint
    name: Run markdownlint
    command: markdownlint-cli2

  - id: prettier
    name: Run prettier
    command: prettier --check .

  - id: backend-verify
    name: Backend build and tests (Maven wrapper)
    command: ./mvnw -q -B clean verify

  - id: fix-markdown
    name: Fix all fixable markdown issues
    command: markdownlint-cli2 --fix

  - id: fix-prettier
    name: Fix all fixable prettier issues
    command: prettier --write .

  - id: java-format-check
    name: Check Java formatting
    command: ./mvnw -q -B spotless:check

  - id: java-format-fix
    name: Fix Java formatting
    command: ./mvnw -q -B spotless:apply

waves:
  - id: post-create
    name: Dev Container Post Create
    parallel: true
    checks:
      - gh-auth
      - install-npm-tools
      - install-gh-insitu
      - install-gh-tt
      - install-takt-shortcuts
      - safe-repo
      - repo-gitconfig
      - claude-skills-symlink
      - install-codex
      - agent-config-owner

  - id: prep-runner
    name: Run to prepare GitHub runner
    parallel: true
    checks:
      - gh-auth
      - install-gh-insitu
      - repo-gitconfig
      - install-npm-tools

  - id: trunk-worthy
    name: Minimum quality checks before commit
    parallel: true
    checks:
      - cspell
      - markdownlint
      - prettier
      - backend-verify
      - java-format-check

  - id: fix-all
    name: Fix anything that can be fixed automatically
    parallel: false
    checks:
      - fix-markdown
      - fix-prettier
      - cspell
      - java-format-fix
