# Shared reverse proxy for stage and prod. Caddy is the only container with published ports.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [web]

networks:
  web:
    external: true

volumes:
  caddy-data:
